<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CJP2P Horizon</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f5f5f5; color: #111; font-family: sans-serif; }
header { background: #fff; border-bottom: 1px solid #ccc; padding: 8px 16px;
         display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
header h1 { color: #0055cc; font-size: 20px; letter-spacing: 2px; }
#ws-badge { font-size: 13px; padding: 3px 10px; border-radius: 3px; white-space: nowrap; }
#my-pub { font-size: 12px; font-family: 'Courier New', monospace; color: #7722bb;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
#header-right { margin-left: auto; font-size: 13px; color: #666; white-space: nowrap; }
nav { background: #ebebeb; border-bottom: 1px solid #ccc;
      padding: 5px 16px; display: flex; gap: 8px; flex-wrap: wrap; }
nav a { color: #0055cc; text-decoration: none; font-size: 14px;
        padding: 2px 10px; border: 1px solid #ccc; border-radius: 3px; }
nav a:hover { background: #fff; border-color: #0055cc; }
#status-bar { padding: 5px 16px; font-size: 13px; color: #666;
              background: #fff; border-bottom: 1px solid #eee; }
#canvas-wrap { display: flex; justify-content: center; padding: 20px 16px; }
canvas { border: 1px solid #ccc; max-width: 100%; display: block; }
#tooltip { position: fixed; background: rgba(255,255,255,0.97);
           border: 1px solid #aaa; padding: 7px 11px; font-size: 12px;
           font-family: 'Courier New', monospace; pointer-events: none;
           display: none; border-radius: 4px; max-width: 420px;
           word-break: break-all; box-shadow: 0 2px 8px rgba(0,0,0,0.12); z-index: 100; }
#tooltip b { font-family: sans-serif; color: #555; font-size: 11px; }
#peer-popup { position: fixed; display: none; background: rgba(255,255,255,0.98);
              border: 1px solid #aaa; padding: 10px 14px; font-size: 12px;
              font-family: 'Courier New', monospace; border-radius: 4px;
              max-width: 380px; word-break: break-all;
              box-shadow: 0 4px 16px rgba(0,0,0,0.18); z-index: 200; }
#peer-popup b { font-family: sans-serif; color: #555; font-size: 11px; }
.pp-close { float: right; font-family: sans-serif; font-size: 16px; cursor: pointer;
            color: #888; margin-left: 8px; line-height: 1; }
.pp-close:hover { color: #333; }
.pp-chat { color: #0055cc; font-family: sans-serif; font-weight: 600; text-decoration: none; }
.pp-chat:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <h1>HORIZON</h1>
  <span id="ws-badge" style="font-size:13px;padding:3px 10px;border-radius:3px;
        background:#fff8e0;color:#7a5200;border:1px solid #7a5200;">connecting...</span>
  <span id="my-pub"></span>
  <span id="header-right"></span>
</header>

<nav>
  <a href="index.html">index</a>
  <a href="dashboard.html">dashboard</a>
  <a href="group_chat.html">group chat</a>
  <a href="chat.html">chat</a>
</nav>

<div id="status-bar">Waiting for data...</div>

<div id="canvas-wrap">
  <canvas id="c" width="960" height="520"></canvas>
</div>

<div id="tooltip"></div>
<div id="peer-popup"></div>

<script>
const BASE = 'http://localhost:24255';
const WS_URL = 'ws://localhost:24255/wt';

const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const statusEl = document.getElementById('status-bar');

const W = canvas.width;
const H = canvas.height;
const HORIZON_Y = Math.round(H * 0.30);  // horizon line y
const MAX_DELAY  = 250;                    // active peer ceiling (ms)
const MARGIN_X   = 50;                    // left/right margin

let peers = [];
let peerHitboxes = [];  // [{x,y,r,peer}]
let myPub = null;

// -- WebSocket (identity only) ------------------------------------------------
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen  = () => setBadge('connected');
  ws.onclose = () => { setBadge('disconnected'); setTimeout(connectWS, 3000); };
  ws.onerror = () => { setBadge('disconnected'); };
  ws.onmessage = e => {
    try {
      for (const msg of JSON.parse(e.data)) {
        const key = msg.YourEd25519 || msg.PleaseSignYourPub;
        if (key) {
          myPub = key.ed25519;
          document.getElementById('my-pub').textContent = myPub;
        }
      }
    } catch {}
  };
}

function setBadge(state) {
  const b = document.getElementById('ws-badge');
  const styles = {
    connected:    ['#e8ffe8', '#1a7a2e'],
    disconnected: ['#ffe8e8', '#cc2200'],
  };
  const [bg, fg] = styles[state] || ['#fff8e0', '#7a5200'];
  b.textContent = state;
  b.style.background = bg;
  b.style.color = fg;
  b.style.border = `1px solid ${fg}`;
}

// -- Data fetch ---------------------------------------------------------------
async function fetchPeers() {
  try {
    const r    = await fetch(`${BASE}/status.json`);
    const data = await r.json();
    peers = data.active_peers || [];
    const now = new Date().toLocaleTimeString();
    document.getElementById('header-right').textContent =
      `updated ${now}`;
    statusEl.textContent =
      `${peers.length} peer(s) ? total ${data.total_peers ?? '?'} known ? ` +
      `version ${data.version || '?'}`;
    draw();
  } catch (err) {
    statusEl.textContent = `Fetch error: ${err.message}`;
  }
}

// -- Pub coloring (same nibble scheme as group_chat.html) ---------------------
const NIBBLE_COLORS = ['#111','#c0392b','#27ae60','#b7950b','#2471a3','#7d3c98','#148f77','#888'];

function coloredPubHtml(pub) {
  const hex = pub.replace('0x', '');
  let html = '';
  for (let i = 0; i < 5 && i < hex.length; i++) {
    const nibble = parseInt(hex[i], 16);
    const color  = NIBBLE_COLORS[nibble & 7];
    if (nibble & 8) {
      html += `<span style="background:${color};color:#fff;padding:0 1px">${hex[i]}</span>`;
    } else {
      html += `<span style="color:${color}">${hex[i]}</span>`;
    }
  }
  html += hex.slice(5);
  return html;
}

function drawColoredPubLabel(ctx, pub, cx, baseY, fs) {
  const hex    = pub.replace('0x', '');
  const colored = hex.slice(0, 5);
  const plain   = hex.slice(5, 8) + '...';
  ctx.font = `${fs}px monospace`;
  const cw   = ctx.measureText('0').width;
  let curX   = cx - cw * (colored.length + plain.length) / 2;
  ctx.textAlign = 'left';
  for (let i = 0; i < colored.length; i++) {
    const nibble = parseInt(colored[i], 16);
    const color  = NIBBLE_COLORS[nibble & 7];
    if (nibble & 8) {
      ctx.fillStyle = color;
      ctx.fillRect(curX, baseY - fs + 2, cw, fs);
      ctx.fillStyle = '#fff';
    } else {
      ctx.fillStyle = color;
    }
    ctx.fillText(colored[i], curX, baseY);
    curX += cw;
  }
  ctx.fillStyle = '#222';
  ctx.fillText(plain, curX, baseY);
  ctx.textAlign = 'center';
}

// -- Perspective mapping ------------------------------------------------------

// delay 0 -> near bottom;  delay MAX -> just above horizon
function delayToY(ms) {
  const t = Math.min(ms, MAX_DELAY) / MAX_DELAY;  // 0..1
  const bottom = H - 36;
  const top    = HORIZON_Y + 8;
  // non-linear: compress more near the horizon (perspective feel)
  return bottom - Math.pow(t, 0.7) * (bottom - top);
}

// delay 0 -> big;  delay MAX -> tiny
function delayToRadius(ms) {
  const t = Math.min(ms, MAX_DELAY) / MAX_DELAY;
  return 30 * Math.pow(1 - t, 0.6) + 4;  // 34px -> 4px
}

// stable X spread from pub key bytes
function pubToX(pub) {
  const h = pub.replace('0x', '');
  const n = parseInt(h.slice(4, 12), 16);   // 4 bytes -> 32 bits
  const usable = W - MARGIN_X * 2;
  return MARGIN_X + (n % usable);
}

// Draw sphere with pub-key-derived vertical stripes + 3-D shine
function drawSphere(ctx, x, y, r, pub) {
  const hex = pub.replace('0x', '');
  const n  = 5;
  const sw = (r * 2) / n;

  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();

  for (let i = 0; i < n; i++) {
    const nibble = parseInt(hex[i] || '0', 16);
    ctx.fillStyle   = NIBBLE_COLORS[nibble & 7];
    ctx.globalAlpha = (nibble & 8) ? 1.0 : 0.55;
    ctx.fillRect(x - r + i * sw, y - r, sw, r * 2);
  }
  ctx.globalAlpha = 1.0;

  // 3-D highlight overlay
  const ng = ctx.createRadialGradient(x - r*0.35, y - r*0.35, r*0.05, x, y, r);
  ng.addColorStop(0,    'rgba(255,255,255,0.75)');
  ng.addColorStop(0.38, 'rgba(255,255,255,0.10)');
  ng.addColorStop(1,    'rgba(0,0,0,0.32)');
  ctx.fillStyle = ng;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);

  ctx.restore();
}

// -- Drawing ------------------------------------------------------------------
function draw() {
  ctx.clearRect(0, 0, W, H);

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
  sky.addColorStop(0, '#b8d8f0');
  sky.addColorStop(1, '#daeefe');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, HORIZON_Y);

  // ground
  const ground = ctx.createLinearGradient(0, HORIZON_Y, 0, H);
  ground.addColorStop(0, '#bdd4a0');
  ground.addColorStop(1, '#9ab87e');
  ctx.fillStyle = ground;
  ctx.fillRect(0, HORIZON_Y, W, H - HORIZON_Y);

  // perspective grid on ground
  const vp = W / 2;
  ctx.strokeStyle = 'rgba(80,110,60,0.18)';
  ctx.lineWidth = 1;
  for (let i = -10; i <= 10; i++) {
    ctx.beginPath();
    ctx.moveTo(vp, HORIZON_Y);
    ctx.lineTo(vp + i * 80, H);
    ctx.stroke();
  }
  let gy = HORIZON_Y + 15;
  while (gy < H) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
    gy += (gy - HORIZON_Y) * 0.45 + 8;
  }

  // horizon line
  ctx.strokeStyle = '#7a9a60';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, HORIZON_Y);
  ctx.lineTo(W, HORIZON_Y);
  ctx.stroke();

  // delay guide lines (dashed)
  ctx.setLineDash([4, 5]);
  ctx.lineWidth = 1;
  for (const ms of [50, 100, 150, 200]) {
    const gy2 = delayToY(ms);
    ctx.strokeStyle = 'rgba(120,120,120,0.28)';
    ctx.beginPath();
    ctx.moveTo(0, gy2);
    ctx.lineTo(W - 44, gy2);
    ctx.stroke();
    ctx.fillStyle = 'rgba(80,80,80,0.55)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${ms}ms`, W - 42, gy2 + 4);
  }
  ctx.setLineDash([]);

  // sort: draw far (high delay) first so near peers overlap them
  const sorted = [...peers].sort((a, b) => b.delay_ms - a.delay_ms);
  peerHitboxes = [];

  for (const peer of sorted) {
    const x   = pubToX(peer.pub);
    const y   = delayToY(peer.delay_ms);
    const r   = delayToRadius(peer.delay_ms);
    const hex = peer.pub.replace('0x', '');
    const glowColor = NIBBLE_COLORS[parseInt(hex[0] || '0', 16) & 7];

    // ground shadow (projected ellipse)
    const shadowY = H - 22;
    const sgr = ctx.createRadialGradient(x, shadowY, 0, x, shadowY, r * 1.4);
    sgr.addColorStop(0, 'rgba(0,0,0,0.18)');
    sgr.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sgr;
    ctx.beginPath();
    ctx.ellipse(x, shadowY, r * 1.6, r * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // glow + striped sphere
    ctx.shadowColor = glowColor;
    ctx.shadowBlur  = r;
    drawSphere(ctx, x, y, r, peer.pub);
    ctx.shadowBlur  = 0;

    // ring
    ctx.strokeStyle = 'rgba(30,30,30,0.3)';
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();

    // labels — flip above sphere when they'd overflow the canvas bottom
    if (r >= 10) {
      const fs = Math.max(8, Math.round(r * 0.52));
      const wouldOverflow = y + r + fs * 2 + 6 > H;

      if (wouldOverflow) {
        // draw above sphere: pub first (higher), then delay closer to it
        drawColoredPubLabel(ctx, peer.pub, x, y - r - (r >= 14 ? fs + 6 : 4), fs);
        if (r >= 14) {
          ctx.fillStyle = '#555';
          ctx.font      = `${Math.max(8, fs - 2)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(peer.delay_ms)} ms`, x, y - r - 4);
        }
      } else {
        drawColoredPubLabel(ctx, peer.pub, x, y + r + fs + 2, fs);
        if (r >= 14) {
          ctx.fillStyle = '#555';
          ctx.font      = `${Math.max(8, fs - 2)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.fillText(`${Math.round(peer.delay_ms)} ms`, x, y + r + fs * 2 + 2);
        }
      }
    }

    peerHitboxes.push({ x, y, r, peer });
  }

  // axis label
  ctx.textAlign = 'left';
  ctx.fillStyle = '#666';
  ctx.font = '12px sans-serif';
  ctx.fillText(`${peers.length} peer${peers.length !== 1 ? 's' : ''}`, 8, H - 6);
}

// -- Tooltip ------------------------------------------------------------------
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;

  let hit = null;
  for (const h of peerHitboxes) {
    const dx = mx - h.x, dy = my - h.y;
    if (dx*dx + dy*dy <= (h.r + 6) * (h.r + 6)) { hit = h; break; }
  }

  if (hit) {
    const pub = hit.peer.pub.replace('0x', '');
    tooltip.innerHTML =
      `<b>ed25519</b><br>${coloredPubHtml(pub)}<br><br>` +
      `<b>delay</b>&nbsp;&nbsp;${Math.round(hit.peer.delay_ms)} ms<br>` +
      `<b>addr</b>&nbsp;&nbsp;&nbsp;${hit.peer.addr}<br><br>` +
      `<span style="color:#0055cc;font-family:sans-serif">click for details</span>`;
    tooltip.style.left = '-9999px';
    tooltip.style.top  = '-9999px';
    tooltip.style.display = 'block';
    const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
    let tx = e.clientX + 16, ty = e.clientY - 8;
    if (tx + tw > window.innerWidth  - 8) tx = e.clientX - tw - 16;
    if (ty + th > window.innerHeight - 8) ty = window.innerHeight - th - 8;
    if (ty < 8) ty = 8;
    if (tx < 8) tx = 8;
    tooltip.style.left = tx + 'px';
    tooltip.style.top  = ty + 'px';
    canvas.style.cursor = 'pointer';
  } else {
    tooltip.style.display = 'none';
    canvas.style.cursor = 'default';
  }
});

canvas.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });

function positionEl(el, cx, cy) {
  el.style.left = '-9999px';
  el.style.top  = '-9999px';
  el.style.display = 'block';
  const ew = el.offsetWidth, eh = el.offsetHeight;
  let x = cx + 16, y = cy - 8;
  if (x + ew > window.innerWidth  - 8) x = cx - ew - 16;
  if (y + eh > window.innerHeight - 8) y = window.innerHeight - eh - 8;
  if (y < 8) y = 8;
  if (x < 8) x = 8;
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
}

const peerPopup = document.getElementById('peer-popup');

canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;

  let hit = null;
  for (const h of peerHitboxes) {
    const dx = mx - h.x, dy = my - h.y;
    if (dx*dx + dy*dy <= (h.r + 6) * (h.r + 6)) { hit = h; break; }
  }

  if (hit) {
    e.stopPropagation();
    tooltip.style.display = 'none';
    const pub = hit.peer.pub.replace('0x', '');
    peerPopup.innerHTML =
      `<span class="pp-close" id="pp-close">&#x2715;</span>` +
      `<b>ed25519</b><br>${coloredPubHtml(pub)}<br><br>` +
      `<b>delay</b>&nbsp;&nbsp;${Math.round(hit.peer.delay_ms)} ms<br>` +
      `<b>addr</b>&nbsp;&nbsp;&nbsp;${hit.peer.addr}<br><br>` +
      `<a href="chat.html?ed25519=${encodeURIComponent(pub)}" class="pp-chat" onclick="event.preventDefault();window.open(this.href,'_blank','width=1000,height=720,noopener,noreferrer')">&#x1F4AC; chat &rarr;</a>` +
      `<br><a href="pong.html?ed25519=${encodeURIComponent(pub)}" class="pp-chat" onclick="event.preventDefault();window.open(this.href,'_blank','width=1000,height=720,noopener,noreferrer')">&#x1F3D3; pong &rarr;</a>` +
      `<br><a href="video.html?ed25519=${encodeURIComponent(pub)}" class="pp-chat" onclick="event.preventDefault();window.open(this.href,'_blank','width=1000,height=720,noopener,noreferrer')">&#x1F4F9; video &rarr;</a>` +
      `<br><a href="http://127.0.0.1:24255/latest/${encodeURIComponent(pub)}/" target="_blank" class="pp-chat">&#x1F3E0; home page &rarr;</a>`;
    positionEl(peerPopup, e.clientX, e.clientY);
    document.getElementById('pp-close').onclick = () => { peerPopup.style.display = 'none'; };
  } else {
    peerPopup.style.display = 'none';
  }
});

document.addEventListener('click', e => {
  if (!peerPopup.contains(e.target)) peerPopup.style.display = 'none';
});

// -- Init ---------------------------------------------------------------------
connectWS();
fetchPeers();
setInterval(fetchPeers, 5000);
</script>
</body>
</html>
