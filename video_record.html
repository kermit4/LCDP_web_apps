<!DOCTYPE html>
<html><head><title>CJP2P video record</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
video { display:block; background:#000; }
.vid-wrap { display:inline-block; position:relative; vertical-align:top; }
.vid-label { font-size:11px; color:#888; }
#controls { display:flex; align-items:center; gap:8px; margin:6px 0; flex-wrap:wrap; }
.led { width:12px; height:12px; border-radius:50%; border:1px solid #888;
       background:#600; display:inline-block; flex-shrink:0; }
.led.on { background:#e00; box-shadow:0 0 5px #e00; animation:blink 1s step-end infinite; }
@keyframes blink { 50% { opacity:0.4; } }
#vuMeter { display:inline-flex; gap:2px; align-items:center; width:90px; flex-shrink:0; }
.vu-seg { width:5px; height:14px; background:#ddd; border-radius:1px; flex-shrink:0; }
#logDiv { font-family:monospace; font-size:11px; white-space:pre-wrap;
          word-break:break-all; max-height:30vh; overflow:auto; border:1px solid #ccc; padding:4px; }
#urlBox { margin:8px 0; padding:8px; background:#e8f4e8; border:1px solid #8c8; border-radius:4px; font-family:monospace; }
</style>
</head>
<body>
ws url: <input id=ws_url size=50>
<br><a href=/>status page</a>
<div id=cameraRow style="font-size:12px;margin:3px 0;" hidden>
  camera: <select id=cameraSelect></select>
  <span id=zoomWrap hidden> &nbsp;zoom: <input type=range id=zoomSlider style="width:100px;vertical-align:middle"></span>
</div>
<p>
<div class=vid-wrap>
  <div class=vid-label>Camera preview</div>
  <video id=localVideo autoplay muted playsinline style="width:320px;height:240px"></video>
</div>
<div id=controls>
  <span class=led id=recLed title="recording"></span>
  <div id=vuMeter></div>
  <button id=startBtn>Start Recording</button>
  <button id=stopBtn disabled>Stop &amp; Publish</button>
  <button id=muteAudioBtn disabled>Mute Mic</button>
  <button id=muteVideoBtn disabled>Mute Video</button>
  <span id=sizeInfo style="font-size:11px;color:#555"></span>
</div>
<div style="font-size:12px;margin:3px 0;">
  <button id=echoCancelBtn>Echo: On</button>
  <button id=noiseBtn>Noise: Off</button>
  <button id=gainBtn>Gain: Off</button>
</div>
<div id=urlBox hidden>
  Recording ready -- share this URL:<br>
  <a id=recUrl href=""></a>
  <br><small id=servedInfo style="color:#555"></small>
</div>
<pre id=stats style="font-size:11px;margin:4px 0;"></pre>
<button id=debugBtn>debug log</button>
<div id=logDiv></div>

<script>
const localVideo    = document.getElementById('localVideo');
const recLed        = document.getElementById('recLed');
const startBtn      = document.getElementById('startBtn');
const stopBtn       = document.getElementById('stopBtn');
const muteAudioBtn  = document.getElementById('muteAudioBtn');
const muteVideoBtn  = document.getElementById('muteVideoBtn');
const sizeInfo      = document.getElementById('sizeInfo');
const recUrl        = document.getElementById('recUrl');
const urlBox        = document.getElementById('urlBox');
const servedInfo    = document.getElementById('servedInfo');
const statsEl       = document.getElementById('stats');
const logDiv        = document.getElementById('logDiv');
const ws_url_input  = document.getElementById('ws_url');
const cameraRow     = document.getElementById('cameraRow');
const cameraSelect  = document.getElementById('cameraSelect');
const zoomWrap      = document.getElementById('zoomWrap');
const zoomSlider    = document.getElementById('zoomSlider');
const echoCancelBtn = document.getElementById('echoCancelBtn');
const noiseBtn      = document.getElementById('noiseBtn');
const gainBtn       = document.getElementById('gainBtn');
ws_url_input.value  = 'ws://localhost:24255/wt';
ws_url_input.onchange = () => { if (socket) socket.close(); };

// -- logging ------------------------------------------------------------------
let logging = false;
document.getElementById('debugBtn').onclick = () => { logging = !logging; };
function log_always(...a) {
    const d = document.createElement('div');
    d.textContent = `[${new Date().toLocaleTimeString()}] ${a.join(' ')}`;
    logDiv.appendChild(d);
    while (logDiv.children.length > 500) logDiv.removeChild(logDiv.firstChild);
    logDiv.scrollTop = logDiv.scrollHeight;
}
function log(...a) { if (logging) log_always(...a); }
window.onerror = (m,u,l,c,e) => { log_always('ERROR:',m,'@',l+':'+c); return false; };
window.onunhandledrejection = e => log_always('UNHANDLED:', e.reason?.stack || e.reason || e);

// -- base64 -------------------------------------------------------------------
function u8toB64(u8) {
    let s = ''; const C = 0x8000;
    for (let i = 0; i < u8.length; i += C) s += String.fromCharCode.apply(null, u8.subarray(i, i+C));
    return btoa(s);
}

// -- LED + VU meter -----------------------------------------------------------
function setLed(el, on) { el.classList.toggle('on', on); }

const VU_N = 12;
const vuSegs = Array.from({length: VU_N}, () => {
    const s = document.createElement('div');
    s.className = 'vu-seg';
    document.getElementById('vuMeter').appendChild(s);
    return s;
});
function setVU(v) {
    const lit = Math.round(v * VU_N);
    vuSegs.forEach((s, i) => {
        s.style.background = i >= lit ? '#ddd'
            : i < VU_N * 0.6 ? '#0a0'
            : i < VU_N * 0.85 ? '#aa0' : '#d00';
    });
}
setVU(0);

// -- audio/video state --------------------------------------------------------
let echoCancel    = true;
let noiseSuppress = false;
let autoGain      = false;
let audioMuted    = false;
let videoMuted    = false;

// -- camera/stream state ------------------------------------------------------
let camStream        = null;
let selectedCameraId = '';
let audioCtx         = null;
let analyser         = null;
let micSrc           = null;
let vuRafId          = null;

// -- recording state ----------------------------------------------------------
// Chunks go to IndexedDB as they arrive; chunkMeta (byte offsets) is kept in
// memory for fast range lookups.  Falls back to plain ArrayBuffer[] in memory
// if IDB is unavailable (still works fine for shorter recordings).
let db                  = null;  // IDB handle; null = memory fallback
let chunkMeta           = [];    // [{start,end}] updated synchronously per chunk
let chunks              = {};    // memory fallback keyed by chunk index
let totalRecordedBytes  = 0;
let pendingWrites       = 0;     // IDB writes still in flight
let recordingDone       = false;
let allWritesDoneResolve = null;
let mediaRecorder  = null;
let recMimeType    = '';
let recordingUUID  = null;
let servedBlocks   = 0;
let totalRequests  = 0;

// -- IndexedDB ----------------------------------------------------------------
const IDB_NAME  = 'cjp2p_video_record';
const IDB_STORE = 'chunks';

function idbOpen() {
    return new Promise((res, rej) => {
        const r = indexedDB.open(IDB_NAME, 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore(IDB_STORE);
        r.onsuccess = e => res(e.target.result);
        r.onerror   = e => rej(e.target.error);
    });
}
function idbPut(key, buf) {
    return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(buf, key);
        tx.oncomplete = res;
        tx.onerror    = e => rej(e.target.error);
    });
}
function idbGet(key) {
    return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const r  = tx.objectStore(IDB_STORE).get(key);
        r.onsuccess = e => res(e.target.result);
        r.onerror   = e => rej(e.target.error);
    });
}
function idbClear() {
    return new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).clear();
        tx.oncomplete = res;
        tx.onerror    = e => rej(e.target.error);
    });
}

(async () => {
    try {
        db = await idbOpen();
        log_always('IndexedDB ready');
    } catch(e) {
        log_always('IndexedDB unavailable, using memory:', e.message || e);
    }
})();

// -- UUID ---------------------------------------------------------------------
function genUUID() {
    if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
    return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> (c/4)))).toString(16));
}

// -- URL helper ---------------------------------------------------------------
function wsToHttpBase(wsUrl) {
    return wsUrl.replace(/^ws(s?)/, 'http$1').replace(/\/wt.*$/, '');
}

// -- VU meter loop (AnalyserNode, no encoding needed) ------------------------
function startVU() {
    if (!camStream || audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    micSrc   = audioCtx.createMediaStreamSource(camStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    micSrc.connect(analyser);
    const buf = new Float32Array(analyser.fftSize);
    function tick() {
        vuRafId = requestAnimationFrame(tick);
        if (audioMuted) { setVU(0); return; }
        analyser.getFloatTimeDomainData(buf);
        let rms = 0;
        for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
        setVU(Math.min(1, Math.sqrt(rms / buf.length) * 6));
    }
    tick();
}

function stopVU() {
    if (vuRafId) { cancelAnimationFrame(vuRafId); vuRafId = null; }
    if (analyser) { analyser.disconnect(); analyser = null; }
    if (micSrc)   { micSrc.disconnect();   micSrc   = null; }
    if (audioCtx) { audioCtx.close();      audioCtx = null; }
    setVU(0);
}

// -- camera helpers -----------------------------------------------------------
async function populateCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
    const cameras = devices.filter(d => d.kind === 'videoinput');
    if (!cameras.length) return;
    cameraSelect.innerHTML = '';
    cameras.forEach((cam, i) => {
        const opt = document.createElement('option');
        opt.value = cam.deviceId;
        opt.textContent = cam.label || `Camera ${i+1}`;
        if (cam.deviceId === selectedCameraId) opt.selected = true;
        cameraSelect.appendChild(opt);
    });
    if (!selectedCameraId && cameras.length) selectedCameraId = cameras[0].deviceId;
    cameraRow.hidden = false;
}

function checkZoom(vt) {
    if (!vt) return;
    const caps = vt.getCapabilities ? vt.getCapabilities() : {};
    if (caps.zoom) {
        zoomSlider.min   = caps.zoom.min;
        zoomSlider.max   = caps.zoom.max;
        zoomSlider.step  = caps.zoom.step || 1;
        zoomSlider.value = vt.getSettings().zoom ?? caps.zoom.min;
        zoomWrap.hidden  = false;
        zoomSlider.oninput = () => {
            vt.applyConstraints({ advanced: [{ zoom: parseFloat(zoomSlider.value) }] }).catch(() => {});
        };
    } else {
        zoomWrap.hidden = true;
    }
}

cameraSelect.onchange = () => switchCamera(cameraSelect.value);

async function switchCamera(deviceId) {
    if (!camStream) { selectedCameraId = deviceId; return; }
    camStream.getVideoTracks().forEach(t => { t.stop(); camStream.removeTrack(t); });
    zoomWrap.hidden = true;
    let newStream;
    try {
        newStream = await navigator.mediaDevices.getUserMedia({
            video: { deviceId: { exact: deviceId }, width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,max:30} }
        });
    } catch(e) { log_always('switchCamera failed:', e.message || e); return; }
    const vt = newStream.getVideoTracks()[0];
    camStream.addTrack(vt);
    localVideo.srcObject = camStream;
    checkZoom(vt);
    vt.enabled = !videoMuted;
    selectedCameraId = deviceId;
    log_always('camera switched:', vt.label || deviceId);
}

// -- start camera + mic -------------------------------------------------------
async function startCameraAndMic() {
    if (camStream) return true;
    const vidConstraint = { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30,max:30} };
    if (selectedCameraId) vidConstraint.deviceId = { exact: selectedCameraId };
    try {
        camStream = await navigator.mediaDevices.getUserMedia({
            video: vidConstraint,
            audio: { channelCount:1, sampleRate:48000,
                     echoCancellation:echoCancel, noiseSuppression:noiseSuppress, autoGainControl:autoGain }
        });
    } catch(e) { log_always('getUserMedia failed:', e.message || e); return false; }
    localVideo.srcObject = camStream;
    const vt = camStream.getVideoTracks()[0];
    selectedCameraId = vt?.getSettings().deviceId || selectedCameraId;
    checkZoom(vt);
    await populateCameras();
    if (cameraSelect.options.length) {
        for (const opt of cameraSelect.options) { if (opt.value === selectedCameraId) { opt.selected = true; break; } }
    }
    muteAudioBtn.disabled = false;
    muteVideoBtn.disabled = false;
    startVU();
    return true;
}

// -- restart audio (echo/noise/gain changes) ----------------------------------
async function restartAudio() {
    if (!camStream) return;
    stopVU();
    camStream.getAudioTracks().forEach(t => { t.stop(); camStream.removeTrack(t); });
    try {
        const s = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount:1, sampleRate:48000,
                     echoCancellation:echoCancel, noiseSuppression:noiseSuppress, autoGainControl:autoGain }
        });
        s.getAudioTracks().forEach(t => camStream.addTrack(t));
    } catch(e) { log_always('audio restart failed:', e.message || e); return; }
    // reapply mute state on the new track
    camStream.getAudioTracks().forEach(t => t.enabled = !audioMuted);
    startVU();
}

// -- audio processing toggles (disabled while recording to avoid stream breaks)
echoCancelBtn.onclick = async () => {
    echoCancel = !echoCancel;
    echoCancelBtn.textContent = echoCancel ? 'Echo: On' : 'Echo: Off';
    await restartAudio();
};
noiseBtn.onclick = async () => {
    noiseSuppress = !noiseSuppress;
    noiseBtn.textContent = noiseSuppress ? 'Noise: On' : 'Noise: Off';
    await restartAudio();
};
gainBtn.onclick = async () => {
    autoGain = !autoGain;
    gainBtn.textContent = autoGain ? 'Gain: On' : 'Gain: Off';
    await restartAudio();
};

// -- mute buttons -------------------------------------------------------------
muteAudioBtn.onclick = () => {
    audioMuted = !audioMuted;
    camStream?.getAudioTracks().forEach(t => t.enabled = !audioMuted);
    muteAudioBtn.textContent = audioMuted ? 'Unmute Mic' : 'Mute Mic';
    if (audioMuted) setVU(0);
};

muteVideoBtn.onclick = async () => {
    if (!camStream) {
        const ok = await startCameraAndMic();
        if (!ok) return;
    }
    videoMuted = !videoMuted;
    camStream.getVideoTracks().forEach(t => t.enabled = !videoMuted);
    muteVideoBtn.textContent = videoMuted ? 'Unmute Video' : 'Mute Video';
};

// -- recording controls -------------------------------------------------------
function setRecordingButtons(recording) {
    startBtn.disabled      = recording;
    stopBtn.disabled       = !recording;
    cameraSelect.disabled  = recording;
    // audio setting changes mid-recording risk breaking the MediaRecorder stream
    echoCancelBtn.disabled = recording;
    noiseBtn.disabled      = recording;
    gainBtn.disabled       = recording;
}

startBtn.onclick = async () => {
    const ok = await startCameraAndMic();
    if (!ok) return;

    // reset recording state; clear previous IDB data
    chunkMeta            = [];
    chunks               = {};
    totalRecordedBytes   = 0;
    recordingDone        = false;
    pendingWrites        = 0;
    allWritesDoneResolve = null;
    servedBlocks         = 0;
    totalRequests        = 0;
    urlBox.hidden        = true;
    if (db) await idbClear().catch(e => log_always('idb clear err:', e));

    // Request persistent storage and log free quota before the first chunk
    // arrives.  persist() is the only call that may show a browser prompt
    // (Firefox only, Chrome silently decides) — resolved here, before recording,
    // so it never interrupts an in-progress take.
    if (db && navigator.storage) {
        if (navigator.storage.persist) {
            const granted = await navigator.storage.persist().catch(() => false);
            if (!granted) log_always('persistent storage not granted — browser may evict IDB under disk pressure');
        }
        if (navigator.storage.estimate) {
            const { usage, quota } = await navigator.storage.estimate().catch(() => ({}));
            if (quota) {
                const freeMB = ((quota - usage) / 1024 / 1024).toFixed(0);
                const quotaMB = (quota / 1024 / 1024).toFixed(0);
                log_always(`storage: ~${freeMB} MB free of ${quotaMB} MB quota`);
            }
        }
    }

    recordingUUID = genUUID();

    const mimeType = ['video/webm;codecs=vp8,opus',
                      'video/webm;codecs=vp9,opus',
                      'video/webm']
        .find(t => MediaRecorder.isTypeSupported(t)) || '';

    try {
        mediaRecorder = new MediaRecorder(camStream, mimeType ? {mimeType} : {});
    } catch(e) { log_always('MediaRecorder init failed:', e.message || e); return; }
    recMimeType = mediaRecorder.mimeType;

    mediaRecorder.ondataavailable = e => {
        if (!e.data || e.data.size === 0) return;
        // Update metadata synchronously to preserve chunk ordering
        const idx   = chunkMeta.length;
        const start = totalRecordedBytes;
        totalRecordedBytes += e.data.size;
        chunkMeta.push({ start, end: totalRecordedBytes });
        sizeInfo.textContent = `recording: ${(totalRecordedBytes/1024/1024).toFixed(1)} MB`;
        // Write data asynchronously to IDB or memory fallback
        pendingWrites++;
        e.data.arrayBuffer().then(async buf => {
            if (db) {
                try { await idbPut(idx, buf); }
                catch(err) {
                    // IDB write failed (quota exceeded etc.) — fall back to memory
                    // for this chunk and all subsequent ones so state stays consistent
                    log_always('IDB write failed, switching to memory fallback:', err.message || err);
                    db = null;
                    chunks[idx] = buf;
                }
            } else {
                chunks[idx] = buf;
            }
        }).catch(err => {
            log_always('arrayBuffer() failed:', err);
        }).finally(() => {
            pendingWrites--;
            if (recordingDone && pendingWrites === 0 && allWritesDoneResolve) {
                allWritesDoneResolve();
                allWritesDoneResolve = null;
            }
        });
    };

    mediaRecorder.onstop = async () => {
        setLed(recLed, false);
        recordingDone = true;
        if (pendingWrites > 0) {
            log_always('flushing writes...');
            await new Promise(res => { allWritesDoneResolve = res; });
        }
        const mb = (totalRecordedBytes / 1024 / 1024).toFixed(2);
        const storageLabel = db ? 'IDB' : (Object.keys(chunks).length ? 'memory' : 'IDB+memory');
        sizeInfo.textContent = `done: ${mb} MB  codec: ${recMimeType}  ${storageLabel}`;
        const url = wsToHttpBase(ws_url_input.value) + '/' + recordingUUID;
        recUrl.href = url;
        recUrl.textContent = url;
        urlBox.hidden = false;
        setRecordingButtons(false);
        log_always('published UUID:', recordingUUID, 'size:', totalRecordedBytes, 'bytes',
                   db ? '(IndexedDB)' : '(memory)');
        updateServedInfo();
    };

    mediaRecorder.start(1000);
    setLed(recLed, true);
    setRecordingButtons(true);
    log_always('recording started  UUID:', recordingUUID, '  codec:', mimeType || '(browser default)');
};

stopBtn.onclick = () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
};

function updateServedInfo() {
    if (!totalRecordedBytes) return;
    servedInfo.textContent =
        `served ${servedBlocks} blocks to ${totalRequests} requests  (${totalRecordedBytes} bytes total)`;
}

// -- content serving ----------------------------------------------------------
// When a remote peer sends PleaseSendContent the server wraps it in a Forwarded
// packet (including the peer's src IP:port) and delivers it to all WebSocket
// clients.  We reply via Forward{src} so the server sends our Content block
// directly back to that peer's UDP address.
const BLOCK_SIZE = 4096; // must match server BLOCK_SIZE! macro (0x1000)

async function readBytes(offset, length) {
    const end    = offset + length;
    const result = new Uint8Array(length);
    let   filled = 0;
    for (let i = 0; i < chunkMeta.length; i++) {
        const cm = chunkMeta[i];
        if (cm.end   <= offset) continue;
        if (cm.start >= end)    break;
        const buf  = db ? await idbGet(i) : chunks[i];
        if (!buf) { log_always(`chunk ${i} missing`); continue; }
        const from = Math.max(cm.start, offset) - cm.start;
        const len  = Math.min(cm.end, end) - Math.max(cm.start, offset);
        result.set(new Uint8Array(buf, from, len), filled);
        filled += len;
    }
    return filled > 0 ? result.subarray(0, filled) : null;
}

async function replyContent(req, replyTo) {
    if (!recordingDone || pendingWrites > 0) { log('recording not ready yet'); return; }
    if (req.id !== recordingUUID) { log('PleaseSendContent for unknown id:', req.id); return; }
    totalRequests++;
    const totalSize = totalRecordedBytes;
    const offset    = req.offset || 0;
    if (offset >= totalSize) { log('PleaseSendContent offset past EOF'); return; }
    const length = Math.min(req.length || BLOCK_SIZE, totalSize - offset);
    const chunk  = await readBytes(offset, length);
    if (!chunk) { log_always('readBytes null at offset', offset); return; }
    if (socket && socket.readyState === WebSocket.OPEN) {
        const content = { Content: {
            id:     req.id,
            offset: offset,
            base64: u8toB64(chunk),
            eof:    totalSize
        }};
        // Forward{src} tells the server to send the Content UDP packet directly
        // back to that address, bypassing ed25519 lookup.
        const wire = replyTo
            ? [{ Forward: { src: replyTo, messages: [content] } }]
            : [content];
        socket.send(JSON.stringify(wire));
        servedBlocks++;
        log(`-> Content src=${replyTo} off=${offset} len=${length}/${totalSize}`);
        updateServedInfo();
    }
}

// -- WebSocket ----------------------------------------------------------------
let socket;
let my_ed25519 = null;

function connect() {
    log_always('ws connecting');
    socket = new WebSocket(ws_url_input.value);
    socket.onclose = () => { log_always('ws closed, reconnecting'); setTimeout(connect, 200); };
    socket.onopen  = () => log_always('ws connected');
    socket.onmessage = event => {
        let outer;
        try { outer = JSON.parse(event.data); } catch(e) { log_always('parse err', e); return; }
        for (const msg of outer) {
            log(JSON.stringify(msg).slice(0, 120));
            if ('YourEd25519' in msg) {
                my_ed25519 = msg.YourEd25519.ed25519;
                log_always('identity:', my_ed25519.slice(0,16)+'...');
            }
            if ('PleaseSignYourPub' in msg) {
                my_ed25519 = msg.PleaseSignYourPub.ed25519;
            }
            // PleaseSendContent arriving from a network peer, forwarded by the server.
            // src tells us who to reply to.
            if ('Forwarded' in msg) {
                const fwd = msg.Forwarded;
                let inner;
                try { inner = JSON.parse(fwd.messages); } catch { continue; }
                for (const m of inner) {
                    if ('PleaseSendContent' in m) replyContent(m.PleaseSendContent, fwd.src);
                }
            }
        }
    };
}

setInterval(() => {
    if (!recordingUUID) { statsEl.textContent = ''; return; }
    const mb = (totalRecordedBytes / 1024 / 1024).toFixed(2);
    statsEl.textContent =
        `id: ${recordingUUID}\nsize: ${mb} MB  served: ${servedBlocks} blocks  requests: ${totalRequests}`;
}, 1000);

connect();
</script>
</body></html>
