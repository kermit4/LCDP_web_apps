<html>
<head>
<title>Group Chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; overflow: hidden; }
body { font-family: monospace; background: #f5f5f5; color: #111; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
#topbar { padding: calc(6px + env(safe-area-inset-top, 0px)) 10px 6px 10px; background: #222; color: #eee; font-size: 13px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
#messages { flex: 1; overflow-y: auto; padding: 8px 10px; }
.msg-row { margin: 3px 0; line-height: 1.5; word-break: break-word; }
.msg-meta { font-weight: bold; font-size: 12px; }
.msg-meta a { color: inherit; text-decoration: none; }
.msg-meta a:hover { text-decoration: underline; }
.msg-text { margin-left: 2px; }
#inputbar { display: flex; padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; background: #ddd; flex-shrink: 0; border-top: 1px solid #bbb; }
#msg_input { flex: 1; font-family: monospace; font-size: 14px; padding: 6px 8px; border: 1px solid #aaa; border-radius: 3px; resize: none; height: 40px; }
#send_btn { padding: 6px 16px; background: #3a7bd5; color: white; border: none; border-radius: 3px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
#send_btn:disabled { background: #aaa; cursor: default; }
#statusbar { padding: 3px 10px; background: #e8e8e8; font-size: 11px; color: #555; border-top: 1px solid #ccc; flex-shrink: 0; }
a { color: #3a7bd5; }
</style>
</head>
<body>

<div id=topbar>
  <span>Group Chat &mdash; <b id=group_name_display>main</b></span>
  <span><span id=peer_count>0</span> peers &nbsp;|&nbsp; <a href=/ style="color:#aaa;">status</a></span>
</div>
<div id=messages></div>
<div id=statusbar>
  <span id=status_text>connecting...</span>
  &nbsp;&nbsp;me: <span id=my_pub_display title="">...</span>
  &nbsp;&nbsp;<button id=notif_btn style="font-size:11px;padding:1px 6px;cursor:pointer;">Enable notifications</button>
</div>
<div id=inputbar>
  <textarea id=msg_input placeholder="Type a message -- Enter to send, Shift+Enter for newline" disabled></textarea>
  <button id=send_btn disabled>Send</button>
</div>

<script>
const GROUP_NAME = 'main';
const LS_KEY = 'gc_messages_' + GROUP_NAME;

let my_ed25519 = null;
let socket;
let known_peers = new Set();
let backoff_delay = 500;
let backoff_timer = null;

function strip_0x(s) { return (s && s.startsWith('0x')) ? s.slice(2) : s; }

function load_messages() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e) { return []; }
}

function save_messages(msgs) {
    localStorage.setItem(LS_KEY, JSON.stringify(msgs));
}

// Returns array of newly added messages (empty if all already known)
function add_messages(new_msgs) {
    const existing = load_messages();
    const keys = new Set(existing.map(m => m.pub_key + ':' + m.timestamp));
    const added = [];
    for (const m of new_msgs) {
        const k = m.pub_key + ':' + m.timestamp;
        if (!keys.has(k)) {
            existing.push(m);
            keys.add(k);
            added.push(m);
        }
    }
    if (added.length > 0) {
        save_messages(existing);
        render_messages();
        const from_others = added.filter(m => m.pub_key !== my_ed25519);
        if (from_others.length > 0) notify_new(from_others);
    }
    return added;
}

// nibble & 7 → CSS color, matching the ANSI 30-37 palette used in the CLI
const NIBBLE_COLORS = ['#111','#c0392b','#27ae60','#b7950b','#2471a3','#7d3c98','#148f77','#888'];

function colored_pub_prefix(pub_key) {
    const wrap = document.createElement('span');
    for (let i = 0; i < 5 && i < pub_key.length; i++) {
        const nibble = parseInt(pub_key[i], 16);
        const color = NIBBLE_COLORS[nibble & 7];
        const s = document.createElement('span');
        if (nibble & 8) {
            s.style.backgroundColor = color;
            s.style.color = '#fff';
        } else {
            s.style.color = color;
        }
        s.textContent = pub_key[i];
        wrap.appendChild(s);
    }
    wrap.appendChild(document.createTextNode('...'));
    return wrap;
}

function fmt_ts(ts) {
    // Round to nearest second, then format in local time
    return new Date(Math.round(ts / 1000) * 1000).toLocaleString();
}

// Regex matches any URI with an explicit scheme (scheme://...).
// Strips trailing punctuation that is likely sentence punctuation, not part of the URL.
const URL_RE = /([a-zA-Z][a-zA-Z0-9+\-.]*:\/\/[^\s<>"]*[^\s<>".,:;!?()'"])/g;

function append_text_with_links(el, text) {
    let last = 0, m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(text)) !== null) {
        if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
        const a = document.createElement('a');
        a.href = m[1];
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = m[1];
        el.appendChild(a);
        last = m.index + m[1].length;
    }
    if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

function render_messages() {
    const msgs = load_messages().sort((a, b) => a.timestamp - b.timestamp);
    const container = document.getElementById('messages');
    const at_bottom = container.scrollTop + container.clientHeight >= container.scrollHeight - 30;
    container.innerHTML = '';
    for (const m of msgs) {
        const row = document.createElement('div');
        row.className = 'msg-row';

        const meta = document.createElement('span');
        meta.className = 'msg-meta';

        const ts_span = document.createElement('span');
        ts_span.textContent = '[' + fmt_ts(m.timestamp) + '] ';

        const key_link = document.createElement('a');
        key_link.href = 'chat.html?ed25519=' + m.pub_key;
        key_link.target = '_blank';
        key_link.title = m.pub_key;
        key_link.appendChild(colored_pub_prefix(m.pub_key));

        meta.appendChild(ts_span);
        meta.appendChild(key_link);

        const text_el = document.createElement('span');
        text_el.className = 'msg-text';
        append_text_with_links(text_el, ': ' + m.text);

        row.appendChild(meta);
        row.appendChild(text_el);
        container.appendChild(row);
    }
    if (at_bottom) container.scrollTop = container.scrollHeight;
}

function my_msgs() {
    if (!my_ed25519) return [];
    return load_messages().filter(m => m.pub_key === my_ed25519);
}

function send_to_peer(peer_pub) {
    if (!socket || socket.readyState !== WebSocket.OPEN) return;
    const msgs = my_msgs();
    if (msgs.length === 0) return;
    socket.send(JSON.stringify([{Forward:{
        to_ed25519: peer_pub,
        messages: msgs.map(m => ({GroupChatMessage:{
            group_name: m.group_name,
            text: m.text,
            timestamp: m.timestamp
        }}))
    }}]));
}

function send_to_all_peers() {
    for (const peer of known_peers) {
        send_to_peer(peer);
    }
}

function schedule_backoff() {
    clearTimeout(backoff_timer);
    backoff_delay = 500;
    tick_backoff();
}

function tick_backoff() {
    backoff_timer = setTimeout(() => {
        send_to_all_peers();
        backoff_delay *= 1.5;
        tick_backoff();
    }, backoff_delay);
}

async function fetch_peers() {
    try {
        const r = await fetch('/status.json');
        const data = await r.json();
        const peers = (data.active_peers || [])
            .map(p => strip_0x(p.pub));
        known_peers = new Set(peers);
        document.getElementById('peer_count').textContent = known_peers.size;
    } catch(e) {}
}

// -- notifications -------------------------------------------------------
const original_title = document.title;
let blink_timer = null;

function start_blink() {
    if (blink_timer) return;
    let on = true;
    blink_timer = setInterval(() => {
        document.title = on ? '(new message) ' + original_title : original_title;
        on = !on;
    }, 1000);
}

function stop_blink() {
    clearInterval(blink_timer);
    blink_timer = null;
    document.title = original_title;
}

let win_focused = document.hasFocus();
window.addEventListener('focus', () => { win_focused = true;  stop_blink(); });
window.addEventListener('blur',  () => { win_focused = false; });

// Tauri IPC -- present on Android (Tauri APK), null in a plain browser.
const tauri_invoke =
    window.__TAURI_INTERNALS__?.invoke?.bind(window.__TAURI_INTERNALS__) ??
    window.__TAURI__?.core?.invoke?.bind(window.__TAURI__.core) ??
    null;
function tauri_notif(cmd, args) { return tauri_invoke('plugin:notification|' + cmd, args ?? {}); }


const LS_NOTIF_OFF = 'gc_notif_off';
function notif_user_wants() { return localStorage.getItem(LS_NOTIF_OFF) !== 'true'; }

async function notif_os_granted() {
    try {
        if (tauri_invoke) return await tauri_notif('is_permission_granted');
        if ('Notification' in window) return Notification.permission === 'granted';
    } catch(e) {}
    return false;
}

async function notif_active() { return notif_user_wants() && await notif_os_granted(); }

async function notif_request() {
    try {
        if (tauri_invoke) return (await tauri_notif('request_permission')) === 'granted';
        if ('Notification' in window) return (await Notification.requestPermission()) === 'granted';
    } catch(e) { throw e; }
    return false;
}

function notif_send(title, body) {
    if (tauri_invoke) {
        tauri_notif('notify', { options: { title, body } });
        return;
    }
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    // Service worker notifications are not suppressed by Chromium when another tab has focus.
    // Direct new Notification() is suppressed in that case.
    const ctrl = navigator.serviceWorker?.controller;
    if (ctrl) {
        ctrl.postMessage({ type: 'notify', title, body });
    } else {
        new Notification(title, { body });
    }
}

async function notify_new(msgs) {
    if (!tauri_invoke && win_focused && !document.hidden) return;
    start_blink();
    if (await notif_active()) {
        const m = msgs.reduce((a, b) => a.timestamp > b.timestamp ? a : b);
        notif_send('Group Chat', m.pub_key.substring(0, 12) + '...: ' + m.text.substring(0, 100));
    }
}

const notif_btn = document.getElementById('notif_btn');

async function update_notif_btn() {
    try {
        if (!tauri_invoke && !('Notification' in window)) {
            notif_btn.textContent = 'Notifications not supported'; notif_btn.disabled = true; return;
        }
        if (!tauri_invoke && 'Notification' in window && Notification.permission === 'denied') {
            notif_btn.textContent = 'Notifications blocked by browser'; notif_btn.disabled = true; return;
        }
        const os_granted = await notif_os_granted();
        if (os_granted && notif_user_wants()) {
            notif_btn.textContent = 'Notifications on -- tap to disable';
        } else if (os_granted && !notif_user_wants()) {
            notif_btn.textContent = 'Notifications off -- tap to enable';
        } else {
            notif_btn.textContent = 'Enable notifications';
        }
        notif_btn.disabled = false;
    } catch(e) { notif_btn.textContent = 'Notif err: ' + e; }
}
update_notif_btn();

notif_btn.onclick = async () => {
    try {
        if (await notif_active()) {
            // Currently on -- turn off
            localStorage.setItem(LS_NOTIF_OFF, 'true');
            notif_btn.textContent = 'Notifications off -- tap to enable';
            return;
        }
        // Currently off -- turn on
        localStorage.removeItem(LS_NOTIF_OFF);
        const already = await notif_os_granted();
        if (already) {
            notif_btn.textContent = 'Notifications on -- tap to disable';
            notif_send('Group Chat', 'Notifications enabled');
            return;
        }
        notif_btn.textContent = 'Requesting...';
        const granted = await notif_request();
        if (granted) {
            notif_btn.textContent = 'Notifications on -- tap to disable';
            notif_send('Group Chat', 'Notifications enabled');
        } else {
            notif_btn.textContent = 'Permission denied';
        }
    } catch(e) {
        notif_btn.textContent = 'Error: ' + e;
    }
};

function connect() {
    if (window.__TAURI__) {
        socket = new WebSocket('ws://localhost:24255/wt');
    } else {
        const url = new URL('/wt', window.location.href);
        url.protocol = url.protocol.replace('http', 'ws');
        socket = new WebSocket(url);
    }
    socket.onclose = () => {
        document.getElementById('status_text').textContent = 'Disconnected -- reconnecting...';
        setTimeout(connect, 200);
    };
    socket.onopen = () => {
        document.getElementById('status_text').textContent = 'Connected';
        let work = Promise.resolve();
        socket.onmessage = async (event) => {
            work = work.then(async () => {
                let outer;
                try { outer = JSON.parse(event.data); } catch(e) { return; }
                let messages, forwarded = false, src = null;
                if (outer[0] && 'Forwarded' in outer[0]) {
                    src = outer[0].Forwarded.from_ed25519;
                    forwarded = true;
                    try { messages = JSON.parse(outer[0].Forwarded.messages); } catch(e) { return; }
                } else {
                    messages = outer;
                }
                const chat_batch = [];
                for (const msg of messages) {
                    if (!forwarded && 'YourEd25519' in msg) {
                        my_ed25519 = msg.YourEd25519.ed25519;
                        on_identity_known();
                    }
                    if (!forwarded && 'PleaseSignYourPub' in msg) {
                        my_ed25519 = msg.PleaseSignYourPub.ed25519;
                        on_identity_known();
                    }
                    if (forwarded && 'GroupChatMessage' in msg) {
                        const gcm = msg.GroupChatMessage;
                        if (gcm.group_name === GROUP_NAME) {
                            chat_batch.push({
                                pub_key: src,
                                text: gcm.text,
                                timestamp: gcm.timestamp,
                                group_name: gcm.group_name
                            });
                        }
                    }
                }
                if (chat_batch.length > 0) add_messages(chat_batch);
            });
        };
    };
}

function on_identity_known() {
    const el = document.getElementById('my_pub_display');
    el.textContent = my_ed25519.substring(0, 16) + '...';
    el.title = my_ed25519;
    document.getElementById('msg_input').disabled = false;
    document.getElementById('send_btn').disabled = false;
    render_messages();
    fetch_peers();
}

function send_message() {
    const input = document.getElementById('msg_input');
    const text = input.value.trim();
    if (!text || !my_ed25519) return;
    const m = { pub_key: my_ed25519, text, timestamp: Date.now(), group_name: GROUP_NAME };
    add_messages([m]);
    input.value = '';
    send_to_all_peers();
    schedule_backoff();
}

document.getElementById('send_btn').onclick = send_message;
document.getElementById('msg_input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send_message(); }
});

// Register service worker for browser notifications (bypasses Chromium's suppression
// of new Notification() when the browser window has focus in another tab).
if (!tauri_invoke && 'serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW register failed:', e));
}

// Init: render stored messages immediately, then connect and start retransmit loop
render_messages();
connect();
schedule_backoff();
fetch_peers();
setInterval(fetch_peers, 8000);
</script>
</body>
</html>
