<html><head><title>Blob Tag</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<p>Their ed25519 addr: <input id=their_ed25519 size=80>
<p>Share this link with your opponent: <a id=link href=""></a>
<p>WebSocket URL: <input id=ws_url size=60>
<p><a href=/>return to network status page</a>
<p>
<span id=status_msg>Waiting for opponent...</span>
&nbsp;<button id=fs_btn>&#x26F6; Fullscreen</button>
<p>
<div id=canvas_wrap style="display:inline-block;">
<canvas id=canvas width=800 height=500 style="border:2px solid #333; background:#fff; cursor:none; display:block;"></canvas>
</div>

<style>
body { background:#f5f5f5; color:#111; font-family:monospace; }
#canvas_wrap { display:block; margin:0 auto; text-align:center; max-width:100%; }
canvas { display:block; margin:0 auto; max-width:100%; height:auto; aspect-ratio:800/500; }
#canvas_wrap:fullscreen {
    display:flex; align-items:center; justify-content:center;
    width:100vw; height:100vh; background:#fff;
}
#canvas_wrap:-webkit-full-screen {
    display:-webkit-flex; -webkit-align-items:center; -webkit-justify-content:center;
    width:100vw; height:100vh; background:#fff;
}
#canvas_wrap:fullscreen canvas, #canvas_wrap:-webkit-full-screen canvas {
    border:none !important;
}
</style>

<script>
const W = 800, H = 500;
const BLOB_R = 18;
const TAG_COOLDOWN = 500;
const SCORE_H = 60; // reserved top area for scores

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const their_input = document.getElementById('their_ed25519');
const link_el = document.getElementById('link');
const status_el = document.getElementById('status_msg');
const fs_btn = document.getElementById('fs_btn');
const canvas_wrap = document.getElementById('canvas_wrap');
const ws_url_input = document.getElementById('ws_url');

ws_url_input.value = 'ws://localhost:24255/wt';
ws_url_input.onchange = () => { if (socket) socket.close(); };

let my_ed25519 = null;
let their_ed25519 = null;
let socket;

let myX = W / 2, myY = H / 2;
let theirX = W / 2, theirY = H / 2;
let myIt = null;
let itDetermined = false;
let myScore = 0, theirScore = 0;
let lastTagTime = 0;
let lastSendTime = 0;

function update_link() {
    if (!my_ed25519) return;
    const url = 'http://localhost:24255' + location.pathname + '?ed25519=' + my_ed25519;
    link_el.href = url;
    link_el.textContent = url;
}

function determine_it() {
    if (itDetermined || !my_ed25519 || !their_ed25519) return;
    itDetermined = true;
    myIt = (my_ed25519 < their_ed25519);
    myX = myIt ? W * 0.25 : W * 0.75;
    myY = H / 2;
    theirX = myIt ? W * 0.75 : W * 0.25;
    theirY = H / 2;
    lastTagTime = Date.now();
    status_el.textContent = myIt ? 'You are IT! Catch the red blob!' : 'Run! They are chasing you!';
}

function set_their_ed25519(v) {
    their_input.value = v;
    their_ed25519 = v;
    determine_it();
}

their_input.addEventListener('input', () => {
    their_ed25519 = their_input.value;
    determine_it();
});

function toGame(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
        x: Math.max(BLOB_R, Math.min(W - BLOB_R, (clientX - r.left) * W / r.width)),
        y: Math.max(SCORE_H + BLOB_R, Math.min(H - BLOB_R, (clientY - r.top) * H / r.height))
    };
}

let touchGrace = 0;
canvas.addEventListener('mousemove', e => {
    if (Date.now() < touchGrace) return;
    const p = toGame(e.clientX, e.clientY);
    myX = p.x; myY = p.y;
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    touchGrace = Date.now() + 400;
    const p = toGame(e.touches[0].clientX, e.touches[0].clientY);
    myX = p.x; myY = p.y;
}, {passive: false});

function send_pos() {
    if (!their_ed25519 || !socket || socket.readyState !== WebSocket.OPEN) return;
    const now = Date.now();
    if (now - lastSendTime < 16) return;
    lastSendTime = now;
    socket.send(JSON.stringify([{Forward: {
        to_ed25519: their_ed25519,
        messages: [{BlobPos: {x: myX, y: myY, it: myIt === true, score_me: myScore, score_them: theirScore}}]
    }}]));
}

function send_tag() {
    if (!their_ed25519 || !socket || socket.readyState !== WebSocket.OPEN) return;
    socket.send(JSON.stringify([{Forward: {
        to_ed25519: their_ed25519,
        messages: [{BlobTag: {}}]
    }}]));
}

function check_tag() {
    if (!myIt || !itDetermined) return;
    const now = Date.now();
    if (now - lastTagTime < TAG_COOLDOWN) return;
    if (Math.hypot(myX - theirX, myY - theirY) < BLOB_R * 2) {
        myIt = false;
        myScore++;
        lastTagTime = now;
        status_el.textContent = 'You tagged them! Now run!';
        send_tag();
    }
}

function drawItRing(x, y, ts) {
    const pulse = 0.5 + 0.5 * Math.sin(ts / 150);
    ctx.beginPath();
    ctx.arc(x, y, BLOB_R + 6 + 4 * pulse, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 180, 0, ' + (0.7 + 0.3 * pulse) + ')';
    ctx.lineWidth = 3;
    ctx.stroke();
}

function draw(ts) {
    ctx.clearRect(0, 0, W, H);

    // Score bar background
    ctx.fillStyle = '#efefef';
    ctx.fillRect(0, 0, W, SCORE_H);

    // Score divider
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, SCORE_H); ctx.lineTo(W, SCORE_H); ctx.stroke();

    // Play area background
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, SCORE_H, W, H - SCORE_H);

    // Scores
    ctx.textAlign = 'center';
    ctx.font = 'bold 30px monospace';
    ctx.fillStyle = '#1a5fb4';
    ctx.fillText(myScore, 80, 42);
    ctx.fillStyle = '#c01c28';
    ctx.fillText(theirScore, W - 80, 42);

    ctx.font = '13px monospace';
    ctx.fillStyle = '#555';
    ctx.fillText('You', 80, 56);
    ctx.fillText('Them', W - 80, 56);

    if (myIt !== null) {
        ctx.fillStyle = '#888';
        ctx.font = '15px monospace';
        ctx.fillText(myIt ? 'IT: YOU' : 'IT: THEM', W / 2, 38);
    }

    // Opponent blob (red)
    ctx.beginPath();
    ctx.arc(theirX, theirY, BLOB_R, 0, Math.PI * 2);
    ctx.fillStyle = '#c01c28';
    ctx.fill();
    if (myIt === false && itDetermined) drawItRing(theirX, theirY, ts);

    // My blob (blue)
    ctx.beginPath();
    ctx.arc(myX, myY, BLOB_R, 0, Math.PI * 2);
    ctx.fillStyle = '#1a5fb4';
    ctx.fill();
    if (myIt === true && itDetermined) drawItRing(myX, myY, ts);
}

let lastFrame = null;
function loop(ts) {
    lastFrame = ts;
    check_tag();
    send_pos();
    draw(ts);
    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

document.addEventListener('fullscreenchange', resizeCanvas);
document.addEventListener('webkitfullscreenchange', resizeCanvas);
function resizeCanvas() {
    if (document.fullscreenElement === canvas_wrap || document.webkitFullscreenElement === canvas_wrap) {
        const scale = Math.min(window.screen.width / W, window.screen.height / H);
        canvas.style.width = (W * scale) + 'px';
        canvas.style.height = (H * scale) + 'px';
    } else {
        canvas.style.width = ''; canvas.style.height = '';
    }
}

fs_btn.onclick = () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const req = canvas_wrap.requestFullscreen || canvas_wrap.webkitRequestFullscreen;
        req.call(canvas_wrap).catch(() => {});
    } else {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
};

function connect() {
    socket = new WebSocket(ws_url_input.value);
    socket.onclose = () => setTimeout(connect, 200);
    socket.onopen = () => {
        let work = Promise.resolve();
        socket.onmessage = async (event) => {
            work = work.then(async () => {
                let outer;
                try { outer = JSON.parse(event.data); } catch(e) { return; }
                let messages, forwarded = false, src = null;
                if ('Forwarded' in outer[0]) {
                    src = outer[0].Forwarded.from_ed25519;
                    forwarded = true;
                    if (their_ed25519 && src !== their_ed25519) return;
                    try { messages = JSON.parse(outer[0].Forwarded.messages); } catch(e) { return; }
                } else {
                    messages = outer;
                }
                for (const msg of messages) {
                    if (!forwarded && 'YourEd25519' in msg) {
                        my_ed25519 = msg.YourEd25519.ed25519;
                        update_link();
                        determine_it();
                    }
                    if (!forwarded && 'PleaseSignYourPub' in msg) {
                        my_ed25519 = msg.PleaseSignYourPub.ed25519;
                        update_link();
                        determine_it();
                    }
                    if (forwarded && 'BlobPos' in msg) {
                        theirX = msg.BlobPos.x;
                        theirY = msg.BlobPos.y;
                        // it field is for rendering only; do NOT modify myIt from BlobPos
                    }
                    if (forwarded && 'BlobTag' in msg) {
                        theirScore++;
                        myIt = true;
                        lastTagTime = Date.now();
                        status_el.textContent = 'They tagged you! Go catch them!';
                    }
                }
            });
        };
        const params = new URLSearchParams(window.location.search);
        params.forEach((v, k) => { if (k === 'ed25519') set_their_ed25519(v); });
    };
}
connect();
</script>
</body>
</html>
