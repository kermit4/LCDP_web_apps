<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Chirp &#128038; P2P Microblogging</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f7f9fa;
  color: #14171a;
  min-height: 100vh;
}

#header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,0.96);
  border-bottom: 1px solid #e1e8ed;
  padding: calc(6px + env(safe-area-inset-top,0px)) 16px 6px;
  display: flex; align-items: center; justify-content: space-between;
  height: calc(53px + env(safe-area-inset-top,0px));
}
#header h1 { font-size: 20px; font-weight: 800; color: #1da1f2; letter-spacing: -0.5px; }
#header-right { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #657786; }
#peer-badge {
  background: #1da1f2; color: #fff;
  padding: 2px 10px; border-radius: 20px;
  font-weight: 700; font-size: 12px;
}

#main { max-width: 600px; margin: 0 auto; }

#status-line {
  padding: 5px 16px; font-size: 11px; color: #657786;
  background: #f5f8fa; border-bottom: 1px solid #e1e8ed;
  display: flex; align-items: center; gap: 8px;
}
#status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #ccc; flex-shrink: 0; transition: background 0.4s;
}
#status-dot.ok { background: #17bf63; }

#filter-bar {
  display: none;
  background: #e8f5fe; border-bottom: 1px solid #b3d9f7;
  padding: 7px 16px; font-size: 13px; color: #1da1f2;
  align-items: center; gap: 10px;
}
#filter-bar button {
  background: none; border: 1px solid #b3d9f7; cursor: pointer;
  color: #657786; font-size: 12px; padding: 2px 10px; border-radius: 12px;
}
#filter-bar button:hover { background: #d4ecfa; }

#compose-box {
  background: #fff;
  border-bottom: 1px solid #e1e8ed;
  padding: 12px 16px;
}
#compose-inner { display: flex; gap: 12px; align-items: flex-start; }
.avatar {
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; color: #fff; flex-shrink: 0; user-select: none;
}
#avatar-compose { width: 48px; height: 48px; font-size: 20px; background: #e1e8ed; color: #aab8c2; }
#compose-right { flex: 1; }
#reply-indicator {
  display: none; font-size: 13px; color: #1da1f2; margin-bottom: 4px;
}
#reply-indicator button {
  background: none; border: none; cursor: pointer; color: #aab8c2;
  font-size: 12px; margin-left: 6px; padding: 0;
}
#reply-preview {
  display: none;
  font-size: 13px; color: #657786;
  border-left: 3px solid #cfe8fb;
  padding: 3px 8px; margin-bottom: 8px;
  white-space: pre-wrap; word-break: break-word;
  overflow: hidden; max-height: 3.6em;
}
#chirp-input {
  width: 100%; font-family: inherit; font-size: 18px;
  border: none; outline: none; resize: none; min-height: 72px;
  color: #14171a; background: transparent;
}
#chirp-input::placeholder { color: #aab8c2; }
#compose-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: 12px;
  margin-top: 8px; padding-top: 8px; border-top: 1px solid #e1e8ed;
}
#char-count { font-size: 13px; color: #aab8c2; }
#char-count.warn { color: #e0245e; font-weight: 700; }
#chirp-btn {
  background: #1da1f2; color: #fff; border: none;
  padding: 8px 20px; border-radius: 20px;
  font-size: 15px; font-weight: 700; cursor: pointer;
}
#chirp-btn:hover:not(:disabled) { background: #1a91da; }
#chirp-btn:disabled { background: #aad4f5; cursor: default; }

#feed { background: #fff; }

.chirp-card {
  border-bottom: 1px solid #e1e8ed;
  padding: 12px 16px; display: flex; gap: 12px;
}
.chirp-card:last-child { border-bottom: none; }
@keyframes flash-bg { 0% { background: #d6eefa; } 100% { background: #fff; } }
.chirp-card.flash { animation: flash-bg 1.4s ease-out; }
.chirp-avatar {
  width: 48px; height: 48px; font-size: 18px;
  cursor: pointer; flex-shrink: 0;
}
.chirp-avatar:hover { opacity: 0.85; }
.chirp-body { flex: 1; min-width: 0; }
.chirp-header {
  display: flex; align-items: baseline; gap: 5px;
  flex-wrap: wrap; margin-bottom: 2px;
}
.chirp-name {
  font-weight: 700; font-size: 15px; cursor: pointer; color: #14171a;
}
.chirp-name:hover { text-decoration: underline; }
.me-badge {
  font-size: 10px; background: #1da1f2; color: #fff;
  padding: 0 5px; border-radius: 8px; vertical-align: middle;
  margin-left: 3px; font-weight: 400;
}
.chirp-handle { color: #657786; font-size: 13px; font-family: monospace; }
.chirp-ts { color: #aab8c2; font-size: 13px; margin-left: auto; white-space: nowrap; }
.chirp-ts:hover { text-decoration: underline; cursor: default; }
.reply-to-line {
  font-size: 13px; color: #657786; margin-bottom: 3px;
}
.reply-to-line a { color: #1da1f2; cursor: pointer; text-decoration: none; }
.reply-to-line a:hover { text-decoration: underline; }
.chirp-text {
  font-size: 15px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
.chirp-text a { color: #1da1f2; text-decoration: none; }
.chirp-text a:hover { text-decoration: underline; }
.chirp-actions { display: flex; gap: 20px; margin-top: 9px; }
.act-btn {
  background: none; border: none; cursor: pointer;
  color: #aab8c2; font-size: 13px; padding: 0;
  display: flex; align-items: center; gap: 4px;
  transition: color 0.12s;
}
.act-btn:hover { color: #1da1f2; }

#empty-feed {
  padding: 48px 16px; text-align: center; color: #657786;
}
#empty-feed strong { font-size: 17px; color: #14171a; }
#empty-feed p { margin-top: 8px; font-size: 14px; }

/* mobile */
@media (max-width: 480px) {
  .chirp-handle { display: none; }
  #chirp-input { font-size: 16px; }
}
</style>
</head>
<body>

<div id="header">
  <h1>&#128038; Chirp</h1>
  <div id="header-right">
    <span id="peer-badge">0 peers</span>
    <a href="/" style="color:#aab8c2;">status</a>
  </div>
</div>

<div id="main">
  <div id="status-line">
    <div id="status-dot"></div>
    <span id="status-text">connecting&hellip;</span>
    &nbsp;&middot;&nbsp;
    <span id="my-pub-display" title="">me: &hellip;</span>
  </div>

  <div id="filter-bar">
    <span>showing: <b id="filter-name">&hellip;</b></span>
    <button onclick="clearFilter()">&#x2715; all chirps</button>
  </div>

  <div id="compose-box">
    <div id="compose-inner">
      <div id="avatar-compose" class="avatar">?</div>
      <div id="compose-right">
        <div id="reply-indicator">
          &#8617; Replying to <b id="reply-to-label">&hellip;</b>
          <button onclick="cancelReply()" title="Cancel reply">&#x2715;</button>
        </div>
        <div id="reply-preview"></div>
        <textarea id="chirp-input" placeholder="What&#39;s chirping?" maxlength="280" disabled></textarea>
        <div id="compose-footer">
          <span id="char-count">280</span>
          <button id="chirp-btn" disabled>Chirp</button>
        </div>
      </div>
    </div>
  </div>

  <div id="feed"></div>
  <div id="empty-feed" style="display:none">
    <strong>No chirps yet</strong>
    <p>Post something above, or wait for peers to connect and share chirps.</p>
    <p style="margin-top:16px;font-size:12px;color:#aab8c2">
      Your identity is your node&#39;s ed25519 public key &mdash; no signup needed.
    </p>
  </div>
</div>

<script>
const LS_KEY = 'chirp_v1';
const MAX_STORED = 500;

let my_pub = null;
let known_peers = new Set();
let socket = null;
let filter_pub = null;
let reply_to = null;   // {pub, ts}
let backoff_timer = null;
let backoff_ms = 500;

// ---- storage ----
function load() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch { return []; }
}
function save(arr) {
  if (arr.length > MAX_STORED) arr = arr.slice(-MAX_STORED);
  localStorage.setItem(LS_KEY, JSON.stringify(arr));
}
function chirp_key(c) { return c.pub + ':' + c.ts; }

function ingest(incoming) {
  const existing = load();
  const seen = new Set(existing.map(chirp_key));
  let added = 0;
  for (const c of incoming) {
    if (!seen.has(chirp_key(c))) {
      existing.push(c);
      seen.add(chirp_key(c));
      added++;
    }
  }
  if (added > 0) {
    existing.sort((a, b) => a.ts - b.ts);
    save(existing);
    render();
  }
}

// ---- identity / color ----
function strip0x(s) { return s && s.startsWith('0x') ? s.slice(2) : s; }
const COLORS = ['#1da1f2','#17bf63','#e0245e','#7b68ee','#f5630a',
                '#f4c430','#1a9c5b','#8b3a8b','#c07020','#20a080'];
function pub_color(pub) { return COLORS[parseInt(pub.slice(0,3),16) % COLORS.length]; }
function pub_letter(pub) { return pub[0].toUpperCase(); }
function short(pub) { return pub.slice(0,8); }

const NIBBLE_COLORS = ['#111','#c0392b','#27ae60','#b7950b','#2471a3','#7d3c98','#148f77','#888'];
function colored_pub_prefix(pub, suffix_text, suffix_color) {
  const wrap = document.createElement('span');
  for (let i = 0; i < 5 && i < pub.length; i++) {
    const nibble = parseInt(pub[i], 16);
    const s = document.createElement('span');
    if (nibble & 8) { s.style.backgroundColor = NIBBLE_COLORS[nibble & 7]; s.style.color = '#fff'; }
    else            { s.style.color = NIBBLE_COLORS[nibble & 7]; }
    s.textContent = pub[i];
    wrap.appendChild(s);
  }
  if (suffix_text) {
    const rest = document.createElement('span');
    if (suffix_color) rest.style.color = suffix_color;
    rest.textContent = suffix_text;
    wrap.appendChild(rest);
  }
  return wrap;
}

function make_avatar(pub, big) {
  const d = document.createElement('div');
  d.className = 'avatar' + (big ? ' chirp-avatar' : '');
  d.style.width = big ? '48px' : '36px';
  d.style.height = big ? '48px' : '36px';
  d.style.fontSize = big ? '18px' : '14px';
  d.style.background = pub_color(pub);
  d.textContent = pub_letter(pub);
  return d;
}

// ---- time ----
function rel(ts) {
  const d = Date.now() - ts;
  if (d < 60e3)  return Math.max(1, Math.round(d/1e3))  + 's';
  if (d < 3600e3) return Math.round(d/60e3) + 'm';
  if (d < 86400e3) return Math.round(d/3600e3) + 'h';
  return new Date(ts).toLocaleDateString();
}

// ---- linkify ----
const URL_RE = /([a-zA-Z][a-zA-Z0-9+\-.]*:\/\/[^\s<>"]*[^\s<>".,:;!?()'"])/g;
function linkify(el, text) {
  let last = 0, m;
  URL_RE.lastIndex = 0;
  while ((m = URL_RE.exec(text)) !== null) {
    if (m.index > last) el.appendChild(document.createTextNode(text.slice(last, m.index)));
    const a = document.createElement('a');
    a.href = m[1]; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = m[1];
    el.appendChild(a);
    last = m.index + m[1].length;
  }
  if (last < text.length) el.appendChild(document.createTextNode(text.slice(last)));
}

// ---- render ----
function render() {
  const all = load();
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty-feed');

  let shown = filter_pub ? all.filter(c => c.pub === filter_pub) : all;
  shown = shown.slice().reverse();

  if (shown.length === 0) {
    feed.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  const by_key = {};
  for (const c of all) by_key[chirp_key(c)] = c;

  feed.innerHTML = '';
  for (const c of shown) feed.appendChild(make_card(c, by_key));
}

function make_card(c, by_key) {
  const card = document.createElement('div');
  card.className = 'chirp-card';
  card.dataset.key = chirp_key(c);

  const av = make_avatar(c.pub, true);
  av.onclick = () => setFilter(c.pub);
  card.appendChild(av);

  const body = document.createElement('div');
  body.className = 'chirp-body';

  // header
  const hdr = document.createElement('div');
  hdr.className = 'chirp-header';

  const name = document.createElement('span');
  name.className = 'chirp-name';
  name.appendChild(document.createTextNode('@'));
  name.appendChild(colored_pub_prefix(c.pub, c.pub.slice(5,8), null));
  if (c.pub === my_pub) {
    const b = document.createElement('span');
    b.className = 'me-badge';
    b.textContent = 'me';
    name.appendChild(b);
  }
  name.onclick = () => setFilter(c.pub);

  name.title = c.pub;

  const ts_el = document.createElement('span');
  ts_el.className = 'chirp-ts';
  ts_el.textContent = rel(c.ts);
  ts_el.title = new Date(c.ts).toLocaleString();

  hdr.appendChild(name);
  hdr.appendChild(ts_el);
  body.appendChild(hdr);

  // reply-to line
  if (c.reply_pub) {
    const rtl = document.createElement('div');
    rtl.className = 'reply-to-line';
    const a = document.createElement('a');
    a.textContent = '↳ @' + short(c.reply_pub) + '…';
    a.title = c.reply_pub;
    a.onclick = (e) => {
      e.stopPropagation();
      scrollToChirp(c.reply_pub, c.reply_ts);
    };
    rtl.appendChild(a);
    body.appendChild(rtl);
  }

  // text
  const txt = document.createElement('div');
  txt.className = 'chirp-text';
  linkify(txt, c.text);
  body.appendChild(txt);

  // actions
  const acts = document.createElement('div');
  acts.className = 'chirp-actions';

  const reply_btn = document.createElement('button');
  reply_btn.className = 'act-btn';
  reply_btn.innerHTML = '&#128172; Reply';
  reply_btn.onclick = () => start_reply(c);
  acts.appendChild(reply_btn);

  body.appendChild(acts);
  card.appendChild(body);
  return card;
}

// ---- filter ----
function setFilter(pub) {
  filter_pub = pub;
  document.getElementById('filter-bar').style.display = 'flex';
  document.getElementById('filter-name').textContent =
    '@' + short(pub) + (pub === my_pub ? ' (you)' : '');
  render();
}
function clearFilter() {
  filter_pub = null;
  document.getElementById('filter-bar').style.display = 'none';
  render();
}

// ---- reply ----
function start_reply(c) {
  reply_to = { pub: c.pub, ts: c.ts };
  document.getElementById('reply-indicator').style.display = 'block';
  document.getElementById('reply-to-label').textContent = '@' + short(c.pub) + '…';
  const preview = document.getElementById('reply-preview');
  preview.textContent = c.text.length > 120 ? c.text.slice(0, 120) + '…' : c.text;
  preview.style.display = 'block';
  document.getElementById('chirp-input').focus();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
function cancelReply() {
  reply_to = null;
  document.getElementById('reply-indicator').style.display = 'none';
  document.getElementById('reply-preview').style.display = 'none';
}

function scrollToChirp(pub, ts) {
  const key = pub + ':' + ts;
  if (filter_pub) {
    filter_pub = null;
    document.getElementById('filter-bar').style.display = 'none';
    render();
  }
  const card = document.querySelector('[data-key="' + key + '"]');
  if (card) {
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    card.classList.add('flash');
    card.addEventListener('animationend', () => card.classList.remove('flash'), { once: true });
  }
}

// ---- compose ----
const input_el = document.getElementById('chirp-input');
const count_el = document.getElementById('char-count');
const btn_el   = document.getElementById('chirp-btn');

input_el.addEventListener('input', () => {
  const rem = 280 - input_el.value.length;
  count_el.textContent = rem;
  count_el.className = rem < 20 ? 'warn' : '';
  btn_el.disabled = !my_pub || !input_el.value.trim();
});
input_el.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); post(); }
});
btn_el.onclick = post;

function post() {
  const text = input_el.value.trim();
  if (!text || !my_pub) return;
  const c = {
    pub: my_pub,
    ts: Date.now(),
    text,
    reply_pub: reply_to ? reply_to.pub : null,
    reply_ts:  reply_to ? reply_to.ts  : null,
  };
  ingest([c]);
  input_el.value = '';
  count_el.textContent = '280';
  btn_el.disabled = true;
  cancelReply();
  blast_peers();
  arm_backoff();
}

// ---- wire protocol ----
function encode(c) {
  const m = { ts: c.ts, text: c.text };
  if (c.reply_pub && c.reply_ts) { m.reply_pub = c.reply_pub; m.reply_ts = c.reply_ts; }
  return { ChirpMessage: m };
}

function decode(pub, m) {
  return {
    pub,
    ts:        m.ts,
    text:      m.text,
    reply_pub: m.reply_pub || null,
    reply_ts:  m.reply_ts  || null,
  };
}

function my_chirps() { return load().filter(c => c.pub === my_pub); }

function send_to(peer_pub) {
  if (!socket || socket.readyState !== WebSocket.OPEN) return;
  const mine = my_chirps();
  if (mine.length === 0) return;
  socket.send(JSON.stringify([{ Forward: {
    to_ed25519: peer_pub,
    messages: mine.map(encode),
  }}]));
}

function blast_peers() { for (const p of known_peers) send_to(p); }

// exponential backoff retransmit (same pattern as group_chat.html)
function arm_backoff() {
  clearTimeout(backoff_timer);
  backoff_ms = 500;
  tick();
}
function tick() {
  backoff_timer = setTimeout(() => {
    blast_peers();
    backoff_ms = Math.min(backoff_ms * 1.5, 30000);
    tick();
  }, backoff_ms);
}

// ---- websocket ----
function connect() {
  const url = window.__TAURI__
    ? 'ws://localhost:24255/wt'
    : (() => { const u = new URL('/wt', location.href); u.protocol = u.protocol.replace('http','ws'); return u.href; })();

  socket = new WebSocket(url);

  socket.onclose = () => {
    set_status('disconnected — reconnecting…', false);
    setTimeout(connect, 200);
  };

  socket.onopen = () => {
    set_status('connected', true);
    blast_peers();
    socket.onmessage = ev => {
      let outer;
      try { outer = JSON.parse(ev.data); } catch { return; }
      if (!Array.isArray(outer)) return;
      for (const msg of outer) {
        if (!msg || !('Forwarded' in msg)) continue;
        const fwd = msg.Forwarded;
        const from = strip0x(fwd.from_ed25519);
        if (!from) continue;
        let inner;
        try { inner = JSON.parse(fwd.messages); } catch { continue; }
        if (!Array.isArray(inner)) continue;
        const batch = [];
        for (const m of inner) {
          if (m && 'ChirpMessage' in m)
            batch.push(decode(from, m.ChirpMessage));
        }
        if (batch.length) ingest(batch);
      }
    };
  };
}

function set_status(text, ok) {
  document.getElementById('status-text').textContent = text;
  document.getElementById('status-dot').className = ok ? 'ok' : '';
}

// ---- status polling ----
async function poll_status() {
  try {
    const r = await fetch('/status.json');
    const d = await r.json();
    if (!my_pub && d.public_key) {
      my_pub = strip0x(d.public_key);
      const av = document.getElementById('avatar-compose');
      av.style.background = pub_color(my_pub);
      av.textContent = pub_letter(my_pub);
      document.getElementById('my-pub-display').textContent = 'me: @' + short(my_pub) + '…';
      document.getElementById('my-pub-display').title = my_pub;
      input_el.disabled = false;
      btn_el.disabled = !input_el.value.trim();
      render();
    }
    const peers = (d.active_peers || []).map(p => strip0x(p.pub));
    known_peers = new Set(peers);
    document.getElementById('peer-badge').textContent =
      peers.length + ' peer' + (peers.length === 1 ? '' : 's');
  } catch {}
}

// ---- init ----
render();
connect();
arm_backoff();
poll_status();
setInterval(poll_status, 8000);
setInterval(render, 30000);  // refresh relative timestamps
</script>
</body>
</html>
